    <path d="M 252 145 L 298 145 C 330 145 352 165 352 198 C 352 230 330 250 298 250 L 278 250 L 278 335 L 252 335 Z M 278 170 L 278 225 L 295 225 C 314 225 326 215 326 198 C 326 180 314 170 295 170 Z"/>
    
