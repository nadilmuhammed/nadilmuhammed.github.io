    <ellipse cx="396" cy="196" rx="14" ry="7" transform="rotate(-45 396 196)"/>
    <ellipse cx="417" cy="184" rx="14" ry="7" transform="rotate(15 417 184)"/>
  </g>

  <!-- Bottom Right Citrus Fruit -->
  <circle cx="375" cy="380" r="28" fill="#BA8C45"/>
  <path d="M 370 354 C 365 344 374 338 382 342 C 385 348 378 355 370 354 Z" fill="#2F5938"/>
  <path d="M 375 354 C 385 346 394 350 392 357 C 386 360 378 357 375 354 Z" fill="#2F5938"/>
  <ellipse cx="366" cy="372" rx="4" ry="9" transform="rotate(-25 366 372)" fill="#DFC084" opacity="0.6"/>

  <!-- Center "CP" Monogram -->
  <g fill="#2F5938">
    <!-- Letter C -->
    <path d="M 235 188 C 228 178 215 170 195 170 C 160 170 135 198 135 240 C 135 282 160 310 195 310 C 215 310 228 302 236 292 L 236 325 C 224 334 208 338 190 338 C 140 338 105 300 105 240 C 105 180 140 142 190 142 C 208 142 225 146 235 155 Z"/>
    
