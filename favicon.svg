    <path d="M 288 200 C 310 182 320 205 306 220 C 295 224 286 215 288 200 Z" fill="#2F5938"/>
  </g>

  <!-- Text "STORE" -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="12" fill="#2F5938" text-anchor="middle">STORE</text>

  <!-- Text "GROCERY" -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" letter-spacing="14" fill="#BA8C45" text-anchor="middle">GROCERY</text>
