  <!-- Leaf 2 -->
  <path d="M 125 180 C 110 150 125 120 150 130 C 160 148 145 175 125 180 Z" fill="#2F5938"/>
  <!-- Leaf 3 -->
  <path d="M 148 128 C 140 100 165 75 188 92 C 190 115 170 130 148 128 Z" fill="#2F5938"/>

